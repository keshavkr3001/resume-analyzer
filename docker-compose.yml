services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/careerlens.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      FRONTEND_ORIGINS: http://localhost:8080
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: 8
    volumes:
      - careerlens-data:/data
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  careerlens-data:
